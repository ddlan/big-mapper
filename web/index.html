<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big Mapper</title>
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <h1>Big Mapper</h1>
      <p class="sub">How far can transit take you? Drag the black pin to set the start; click anywhere to see the route there.</p>

      <label class="row">
        <span>When</span>
        <select id="period"></select>
      </label>
      <label class="row">
        <span>Time limit</span><output id="maxMinutes-out"></output>
        <input id="maxMinutes" type="range" min="15" max="180" step="5" value="60" />
      </label>
      <label class="row">
        <span>Transfer penalty</span><output id="transferPenaltyMin-out"></output>
        <input id="transferPenaltyMin" type="range" min="0" max="20" step="1" value="5" />
      </label>
      <label class="row">
        <span>Wait for first vehicle</span><output id="initialWaitMin-out"></output>
        <input id="initialWaitMin" type="range" min="0" max="15" step="1" value="0" />
      </label>
      <label class="row">
        <span>Walking speed</span><output id="walkSpeedKmh-out"></output>
        <input id="walkSpeedKmh" type="range" min="3" max="6.5" step="0.5" value="5" />
      </label>

      <fieldset id="modes"><legend>Modes</legend></fieldset>
      <div id="legend"></div>
      <section id="itinerary" hidden></section>
      <p id="status" class="status">Loading transit data…</p>
      <p class="note">Optimistic model: only routes running in the chosen period, fastest scheduled trip between stops, no waiting (unless set above).</p>
    </aside>
    <div id="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
